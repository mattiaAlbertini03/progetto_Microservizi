server.port=8080

jwt.issuer=auth-service
jwt.secret=${JWT_SECRET}

auth-db.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth}
auth-db.user=${AUTH_DB_USER:auth_user}
auth-db.password=${AUTH_DB_PASSWORD}
auth-db.pool.maximum-size=${AUTH_DB_POOL_MAXIMUM_SIZE:4}

auth-mail.smtp.host=${AUTH_MAIL_SMTP_HOST:disabled}
auth-mail.smtp.port=${AUTH_MAIL_SMTP_PORT:587}
auth-mail.smtp.username=${AUTH_MAIL_SMTP_USERNAME:disabled}
auth-mail.smtp.password=${AUTH_MAIL_SMTP_PASSWORD:disabled}
auth-mail.smtp.starttls=${AUTH_MAIL_SMTP_STARTTLS:true}
auth-mail.from=${AUTH_MAIL_FROM:noreply@acme.local}
