apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-simulator-service
  namespace: simulation
  labels:
    app: vehicle-simulator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicle-simulator-service
  template:
    metadata:
      labels:
        app: vehicle-simulator-service
    spec:
      containers:
        - name: vehicle-simulator-service
          image: vehicle-simulator-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: TRACKING_BASE_URL
              value: "http://tracking-service:8080"
            - name: BATTERY_BASE_URL
              value: "http://battery-service:8080"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-simulator-service
  namespace: simulation
  labels:
    app: vehicle-simulator-service
spec:
  selector:
    app: vehicle-simulator-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP