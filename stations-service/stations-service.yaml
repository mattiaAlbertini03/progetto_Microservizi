apiVersion: apps/v1
kind: Deployment
metadata:
  name: stations-service
  namespace: acme
  labels:
    app: stations-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stations-service
  template:
    metadata:
      labels:
        app: stations-service
    spec:
      containers:
        - name: stations-service
          image: stations-service:latest
          imagePullPolicy: Never
          ports:
            - name: soap
              containerPort: 8080
            - name: rest
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: stations-service
  namespace: acme
  labels:
    app: stations-service
spec:
  selector:
    app: stations-service
  ports:
    - name: soap
      port: 8080
      targetPort: 8080
    - name: rest
      port: 8000
      targetPort: 8000
  type: ClusterIP