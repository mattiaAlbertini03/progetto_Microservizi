apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-service
  namespace: acme
  labels:
    app: banking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-service
  template:
    metadata:
      labels:
        app: banking-service
    spec:
      containers:
        - name: banking-service
          image: banking-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: banking-service
  namespace: acme
  labels:
    app: banking-service
spec:
  selector:
    app: banking-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP