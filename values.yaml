connectors:
  inbound:
    mode: disabled

elasticsearch:
  enabled: true
  master:
    replicaCount: 1

    persistence:
      size: 10Gi

    heapSize: 1g

    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi

global:
  elasticsearch:
    enabled: true
  identity:
    auth:
      enabled: false

identity:
  enabled: false

identityKeycloak:
  enabled: false

optimize:
  enabled: false

orchestration:
  clusterSize: "1"
  partitionCount: "1"
  pvcSize: 10Gi
  replicas: 1
  replicationFactor: "1"
