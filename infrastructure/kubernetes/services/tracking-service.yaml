apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      containers:
        - name: tracking-service
          image: tracking-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap.kafka:9092"
            - name: KAFKA_TOPIC_VEHICLE_TRACKING
              value: "vehicle-tracking"
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: acme
spec:
  selector:
    app: tracking-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
