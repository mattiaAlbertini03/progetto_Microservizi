apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-service
  namespace: acme
  labels:
    app: banking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-service
  template:
    metadata:
      labels:
        app: banking-service
    spec:
      containers:
        - name: banking-service
          image: banking-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
            - containerPort: 8000
          env:
            - { name: BANK_DB_HOST, value: "banking-db.acme-persistence" }
            - { name: BANK_DB_PORT, value: "5432" }
            - { name: BANK_DB_NAME, value: "banking" }
            - name: BANK_DB_USER
              valueFrom: { secretKeyRef: { name: banking-db-client-secret, key: username } }
            - name: BANK_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: banking-db-client-secret, key: password } }
---
apiVersion: v1
kind: Service
metadata:
  name: banking-service
  namespace: acme
  labels:
    app: banking-service
spec:
  selector:
    app: banking-service
  ports:
    - name: soap
      port: 8080
      targetPort: 8080
    - name: rest
      port: 8000
      targetPort: 8000
  type: ClusterIP
