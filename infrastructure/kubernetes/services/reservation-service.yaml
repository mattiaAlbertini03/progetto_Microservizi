apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: acme
spec:
  replicas: 1

  selector:
    matchLabels:
      app: reservation-service

  template:
    metadata:
      labels:
        app: reservation-service

    spec:
      containers:
        - name: reservation-service
          image: reservation-service:latest
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: LOGISTICS_SERVICE_URL
              value: "http://logistics-service.acme:8080"

            - name: RESERVATION_DB_URL
              value: "jdbc:postgresql://reservation-db.acme-persistence:5432/reservations"

            - name: RESERVATION_DB_USER
              valueFrom:
                secretKeyRef:
                  name: reservation-db-client-secret
                  key: username

            - name: RESERVATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservation-db-client-secret
                  key: password

---
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: acme
spec:
  selector:
    app: reservation-service

  ports:
    - name: http
      port: 8080
      targetPort: 8080
