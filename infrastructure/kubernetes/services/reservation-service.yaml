apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      containers:
        - name: reservation-service
          image: reservation-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LOGISTICS_SERVICE_URL
              value: "http://logistics-service.acme:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: acme
spec:
  selector:
    app: reservation-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080