apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logistics-service
  template:
    metadata:
      labels:
        app: logistics-service
    spec:
      containers:
        - name: logistics-service
          image: logistics-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: STATIONS_SERVICE_URL
              value: "http://stations-service.acme:8000"

            - name: ACME_MOBILITY_SERVICE_URL
              value: "http://acme-mobility-service.acme:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: logistics-service
  namespace: acme
spec:
  selector:
    app: logistics-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080