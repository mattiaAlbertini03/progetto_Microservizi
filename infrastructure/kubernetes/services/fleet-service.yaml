apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-service
  template:
    metadata:
      labels:
        app: fleet-service
    spec:
      containers:
        - name: fleet-service
          image: fleet-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LOGISTICS_SERVICE_URL
              value: "http://logistics-service.acme:8080"

            - name: RESERVATION_SERVICE_URL
              value: "http://reservation-service.acme:8080"

            - name: SIMULATOR_SERVICE_URL
              value: "http://simulator-service.acme:8080"

            - name: STATION_SERVICE_URL
              value: "http://stations-service.acme:8080"

            - name: QUERY_SERVICE_URL
              value: "http://query-service.acme:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: fleet-service
  namespace: acme
spec:
  selector:
    app: fleet-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080