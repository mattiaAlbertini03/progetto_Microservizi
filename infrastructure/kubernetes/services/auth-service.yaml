apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: AUTH_DB_URL
              value: "jdbc:postgresql://auth-db.acme-persistence:5432/auth"
            - name: AUTH_DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db-client-secret
                  key: username
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-client-secret
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: acme
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
