apiVersion: apps/v1
kind: Deployment
metadata:
  name: stations-service
  namespace: acme
  labels:
    app: stations-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stations-service
  template:
    metadata:
      labels:
        app: stations-service
    spec:
      containers:
        - name: stations-service
          image: stations-service:latest
          imagePullPolicy: Never
          ports:
            - name: soap
              containerPort: 8080
            - name: rest
              containerPort: 8000
          env:
            - { name: STATIONS_DB_HOST, value: "stations-db.acme-persistence" }
            - { name: STATIONS_DB_PORT, value: "5432" }
            - { name: STATIONS_DB_NAME, value: "stations" }
            - name: STATIONS_DB_USER
              valueFrom: { secretKeyRef: { name: stations-db-client-secret, key: username } }
            - name: STATIONS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: stations-db-client-secret, key: password } }
---
apiVersion: v1
kind: Service
metadata:
  name: stations-service
  namespace: acme
  labels:
    app: stations-service
spec:
  selector:
    app: stations-service
  ports:
    - name: soap
      port: 8080
      targetPort: 8080
    - name: rest
      port: 8000
      targetPort: 8000
  type: ClusterIP
