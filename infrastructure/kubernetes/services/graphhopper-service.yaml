apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphhopper-service
  namespace: acme
  labels:
    app: graphhopper-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphhopper-service
  template:
    metadata:
      labels:
        app: graphhopper-service
    spec:
      containers:
        - name: graphhopper-service
          image: graphhopper-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8989
            - containerPort: 8990
          readinessProbe:
            httpGet:
              path: /info
              port: 8989
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /info
              port: 8989
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: graphhopper-service
  namespace: acme
  labels:
    app: graphhopper-service
spec:
  selector:
    app: graphhopper-service
  ports:
    - name: http
      port: 8989
      targetPort: 8989
    - name: admin
      port: 8990
      targetPort: 8990
  type: ClusterIP