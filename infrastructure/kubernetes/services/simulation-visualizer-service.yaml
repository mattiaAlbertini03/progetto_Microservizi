apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-visualizer
  namespace: simulation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulation-visualizer
  template:
    metadata:
      labels:
        app: simulation-visualizer
    spec:
      containers:
        - name: simulation-visualizer
          image: simulation-visualizer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-visualizer
  namespace: simulation
spec:
  selector:
    app: simulation-visualizer
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
  type: NodePort