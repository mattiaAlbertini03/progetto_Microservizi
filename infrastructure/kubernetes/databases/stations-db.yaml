apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stations-db-pvc
  namespace: acme-persistence
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stations-db
  namespace: acme-persistence
spec:
  clusterIP: None
  selector:
    app: stations-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stations-db
  namespace: acme-persistence
spec:
  serviceName: stations-db
  replicas: 1
  selector:
    matchLabels:
      app: stations-db
  template:
    metadata:
      labels:
        app: stations-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: stations-db-secret, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: stations-db-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: stations-db-secret, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: stations-db-storage
              mountPath: /var/lib/postgresql/data
          startupProbe: &probe
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: *probe
          livenessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: stations-db-storage
          persistentVolumeClaim:
            claimName: stations-db-pvc
