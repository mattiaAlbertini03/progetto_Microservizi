apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-service
  labels:
    app: banking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-service
  template:
    metadata:
      labels:
        app: banking-service
    spec:
      containers:
      - name: banking-service
        image: banking-service
        ports:
        - containerPort: 8080
        imagePullPolicy: IfNotPresent