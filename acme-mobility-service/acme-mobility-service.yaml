apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-mobility-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-mobility-service
  template:
    metadata:
      labels:
        app: acme-mobility-service
    spec:
      containers:
        - name: acme-mobility-service
          image: acme-mobility-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: acme-mobility-service
  namespace: acme
spec:
  type: NodePort
  selector:
    app: acme-mobility-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080