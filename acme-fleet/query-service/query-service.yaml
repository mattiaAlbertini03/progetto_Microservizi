apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: query-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap.kafka:9092"
            - name: KAFKA_TOPIC_VEHICLE_TRACKING
              value: "vehicle-tracking"
            - name: KAFKA_TOPIC_VEHICLE_BATTERY
              value: "vehicle-battery"
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: acme
spec:
  type: NodePort
  selector:
    app: query-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
