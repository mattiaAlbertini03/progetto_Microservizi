apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: acme
type: Opaque
stringData:
  JWT_SECRET: "U/sBzg58tPlFrkJoSajPQgFsrRKC/Qf54ga7fopb5MQ="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: acme
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080